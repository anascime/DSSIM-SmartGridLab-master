logging:
  version: 1
  disable_existing_loggers: False
  formatters:
    simple:
      format: "%(asctime)s - %(levelname)s:%(name)s:%(message)s"
  handlers:
    console:
      class: logging.StreamHandler
      level: DEBUG
      formatter: simple
      stream: ext://sys.stdout
    log:
      class: logging.handlers.TimedRotatingFileHandler
      level: DEBUG
      formatter: simple
      filename: logs/dssim.log
      when: midnight
      interval: 1
      backupCount: 5
      encoding: utf8
  loggers:
    "":
      handlers: [console, log]
      level: DEBUG
      propagate: no
    simpleExample:
      level: DEBUG
      handlers: [console]
      propagate: no
  root:
    level: DEBUG
    handlers: [console, log]
