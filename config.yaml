logging:
  version: 1
  disable_existing_loggers: False
  formatters:
    detailed:
      format: "%(asctime)s - %(levelname)s - %(name)s - %(module)s:%(lineno)d - %(message)s"
    compact:
      format: "%(levelname)s:%(name)s:%(message)s"
  handlers:
    console:
      class: logging.StreamHandler
      level: INFO
      formatter: compact
      stream: ext://sys.stdout
    log:
      class: logging.handlers.TimedRotatingFileHandler
      level: DEBUG
      formatter: detailed
      filename: logs/dssim.log
      when: midnight
      interval: 1
      backupCount: 10
      encoding: utf-8
    equipment_log:
      class: logging.handlers.TimedRotatingFileHandler
      level: DEBUG
      formatter: detailed
      filename: logs/equipment.log
      when: midnight
      interval: 1
      backupCount: 10
      encoding: utf-8
  loggers:
    server:
      level: DEBUG
      handlers: [console, log]
      propagate: False
    Core.DSSIM:
      level: DEBUG
      handlers: [console, log]
      propagate: False
    server.equipment:
      level: DEBUG
      handlers: [equipment_log]
      propagate: False
    Core.DSSIM.equipment:
      level: DEBUG
      handlers: [equipment_log]
      propagate: False
  root:
    handlers: [console, log]
    level: INFO
