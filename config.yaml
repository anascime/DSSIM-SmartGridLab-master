version: 1
disable_existing_loggers: False

formatters:
  json_formatter:
    (): pythonjsonlogger.jsonlogger.JsonFormatter
    format: "%(asctime)s %(name)s %(levelname)s %(message)s"
    rename_fields:
      levelname: level
      asctime: time
  simple:
    format: "%(asctime)s - %(levelname)s:%(name)s:%(message)s"
  cSimple:
    format: "%(asctime)s [%(levelname)s] %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: cSimple
    stream: ext://sys.stdout
  tester:
    class: logging.StreamHandler
    formatter: json_formatter
    level: INFO
  log:
    class: logging.handlers.TimedRotatingFileHandler
    level: DEBUG
    formatter: simple
    filename: logs/dssim.log
    when: midnight
    interval: 1
    backupCount: 5
    encoding: utf8
  logT:
    class: logging.handlers.TimedRotatingFileHandler
    level: DEBUG
    formatter: simple
    filename: logs/tap.log
    when: midnight
    interval: 1
    backupCount: 5
    encoding: utf8

loggers:
  "":
    handlers: [console, log]
    level: DEBUG
    propagate: no
  simpleExample:
    level: DEBUG
    handlers: [console]
    propagate: no
  logTap:
    handlers: [console, log]
    level: DEBUG
    propagate: False

root:
  level: DEBUG
  handlers: [console, log]
